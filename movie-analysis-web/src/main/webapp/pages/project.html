<!DOCTYPE html><html>    <head>        <!-- 页面meta -->        <meta charset="utf-8">        <meta http-equiv="X-UA-Compatible" content="IE=edge">        <title>电影评分信息展示</title>        <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">        <!-- 引入样式 -->        <link rel="stylesheet" href="../plugins/elementui/index.css">        <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">        <link rel="stylesheet" href="../css/style.css">    </head>    <body class="hold-transition">        <div id="app">            <h1>电影评分信息展示</h1>            <div class="content-header">                <h2>电影评分查询</h2>            </div>            <div class="app-container">                <div class="box">                    <div class="filter-container">                        <el-input placeholder="请输入电影名称" v-model="movieName" style="width: 200px;" class="filter-item"></el-input>                        <el-button @click="getMovieRatingByName()" class="dalfBut">查询</el-button>                    </div>                    <el-table size="small" current-row-key="movieId" :data="movieRateList" stripe highlight-current-row>                        <el-table-column prop="movieId" label="电影编号" align="center"></el-table-column>                        <el-table-column prop="movieName" label="电影名称" align="center"></el-table-column>                        <el-table-column prop="movieGenres" label="电影风格" align="center"></el-table-column>                        <el-table-column prop="maxRating" label="最高评分" align="center"></el-table-column>                        <el-table-column prop="avgRating" label="平均评分" align="center"></el-table-column>                        <el-table-column prop="minRating" label="最小评分" align="center"></el-table-column>                        <el-table-column prop="timestamp" label="时间" align="center"></el-table-column>                    </el-table>                </div>            </div>            <div class="content-header">                <h2>热门电影TOP10</h2>            </div>            <div class="app-container">                <div class="box">                    <el-table size="small" :data="hotMovieList" stripe highlight-current-row>                        <el-table-column prop="startTime" label="统计开始时间" align="center"></el-table-column>                        <el-table-column prop="endTime" label="统计结果时间" align="center"></el-table-column>                        <el-table-column prop="name" label="电影名称" align="center"></el-table-column>                        <el-table-column prop="count" label="评分次数" align="center"></el-table-column>                        <el-table-column prop="avgRating" label="平均评分" align="center"></el-table-column>                        <el-table-column prop="updateTime" label="更新时间" align="center"></el-table-column>                    </el-table>                </div>            </div>        </div>    </body>    <!-- 引入组件库 -->    <script src="../js/vue.js"></script>    <script src="../plugins/elementui/index.js"></script>    <script type="text/javascript" src="../js/jquery.min.js"></script>    <script src="../js/axios-0.18.0.js"></script>    <script>        var vue = new Vue({            el: '#app',            data:{				hotMovieList: [],//当前页要展示的列表数据                rateList: [],                movieRateList: [],                movieId: '1',                movieName: "Tom",                formData: {},//表单数据                dialogFormVisible: false,//控制表单是否可见                dialogFormVisible4Edit:false,//编辑表单是否可见                rules: {//校验规则                    type: [{ required: true, message: '图书类别为必填项', trigger: 'blur' }],                    name: [{ required: true, message: '图书名称为必填项', trigger: 'blur' }]                }            },            //钩子函数，VUE对象初始化完成后自动执行            created() {                this.getAll();                this.getMovieRatingByName();            },            methods: {                // 热门评分电影列表                getAll() {                    //发送ajax请求                    axios.get("/movies/hot").then((res)=>{                        this.hotMovieList = res.data.data;                    });                },                // 根据电影名称查询评分                getMovieRatingByName() {                    axios.get("/movies/name/"+this.movieName).then((res)=>{                        console.log(res.data.data);                        if(res.data.code == 20041){                            this.movieRateList = res.data.data;                        }else{                            this.$message.error(res.data.msg);                        }                    });                }                // 根据电影ID查询评分                // getMovieRatingById() {                //     //查询数据，根据id查询                //     axios.get("/movies/id/"+this.movieId).then((res)=>{                //         console.log(res.data.data);                //         if(res.data.code == 20041){                //             this.rateList = res.data.data;                //         }else{                //             this.$message.error(res.data.msg);                //         }                //     });                // }            }        })    </script></html>
